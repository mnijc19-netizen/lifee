<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 400" width="100%" height="100%">
  <defs>
    <linearGradient id="nz-bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#061a23" />
      <stop offset="50%" stop-color="#0c2e3d" />
      <stop offset="100%" stop-color="#041219" />
    </linearGradient>
    <pattern id="nz-grid" width="20" height="20" patternUnits="userSpaceOnUse">
      <path d="M 20 0 L 0 0 0 20" fill="none" stroke="rgba(255, 255, 255, 0.03)" stroke-width="1"/>
    </pattern>
  </defs>

  <rect width="640" height="400" rx="16" fill="url(#nz-bg)" />
  <rect width="640" height="400" rx="16" fill="url(#nz-grid)" />
  <rect x="1" y="1" width="638" height="398" rx="15" fill="none" stroke="rgba(16, 185, 129, 0.35)" stroke-width="1.5" />

  <rect x="0" y="0" width="640" height="4" fill="#059669" />

  <!-- Silver Fern Watermark -->
  <g transform="translate(460, 90) rotate(-20) scale(0.8)" opacity="0.08" fill="#ffffff">
    <path d="M 0 200 C 20 180, 50 150, 70 110 C 90 70, 110 30, 120 0 C 115 30, 95 80, 70 120 C 45 160, 20 185, 0 200 Z"/>
    <path d="M 30 150 C 60 140, 90 125, 110 100 C 90 115, 60 135, 30 150 Z"/>
    <path d="M 50 110 C 80 100, 110 85, 130 60 C 105 80, 75 100, 50 110 Z"/>
  </g>

  <g transform="translate(32, 34)">
    <rect x="0" y="0" width="144" height="24" rx="6" fill="rgba(16, 185, 129, 0.15)" stroke="rgba(16, 185, 129, 0.4)" stroke-width="1" />
    <text x="10" y="16" fill="#34d399" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="11" font-weight="700">🇳🇿 新西兰官方劳工公报</text>
    <text x="156" y="16" fill="#94a3b8" font-family="ui-monospace, monospace" font-size="11">Minimum Wage Order 2026 · MBIE</text>

    <text x="0" y="54" fill="#f8fafc" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="20" font-weight="800">2026 法定工薪基准与 AEWV 新政</text>
    <text x="0" y="75" fill="#94a3b8" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="12">商业创新与就业部 (MBIE) &amp; 移民局 (INZ) 联合执行令</text>
  </g>

  <g transform="translate(32, 132)">
    <rect x="0" y="0" width="176" height="114" rx="10" fill="rgba(6, 26, 35, 0.9)" stroke="rgba(16, 185, 129, 0.4)" stroke-width="1.2" />
    <circle cx="18" cy="18" r="4" fill="#10b981" />
    <text x="28" y="22" fill="#94a3b8" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="11" font-weight="600">成人法定最低时薪</text>
    <text x="14" y="58" fill="#34d399" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="28" font-weight="900">$23.95</text>
    <text x="120" y="56" fill="#6ee7b7" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="13">NZD/h</text>
    <path d="M 14 72 L 162 72" stroke="rgba(255, 255, 255, 0.1)" stroke-width="1" />
    <text x="14" y="92" fill="#cbd5e1" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="10">2026-04-01 正式生效</text>
    <text x="14" y="105" fill="#ef4444" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="9">严格拒斥旧版 $23.15 滞后数据</text>
  </g>

  <g transform="translate(224, 132)">
    <rect x="0" y="0" width="176" height="114" rx="10" fill="rgba(6, 26, 35, 0.9)" stroke="rgba(14, 165, 233, 0.4)" stroke-width="1.2" />
    <circle cx="18" cy="18" r="4" fill="#38bdf8" />
    <text x="28" y="22" fill="#94a3b8" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="11" font-weight="600">移民审理基准中位数</text>
    <text x="14" y="58" fill="#38bdf8" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="28" font-weight="900">$35.00</text>
    <text x="120" y="56" fill="#7dd3fc" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="13">NZD/h</text>
    <path d="M 14 72 L 162 72" stroke="rgba(255, 255, 255, 0.1)" stroke-width="1" />
    <text x="14" y="92" fill="#cbd5e1" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="10">2026-03-09 正式生效</text>
    <text x="14" y="105" fill="#ef4444" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="9">严格拒斥旧版 $31.61 滞后数据</text>
  </g>

  <g transform="translate(416, 132)">
    <rect x="0" y="0" width="192" height="114" rx="10" fill="rgba(6, 26, 35, 0.9)" stroke="rgba(245, 158, 11, 0.4)" stroke-width="1.2" />
    <circle cx="18" cy="18" r="4" fill="#fbbf24" />
    <text x="28" y="22" fill="#94a3b8" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="11" font-weight="600">叉车工监管基准</text>
    <text x="14" y="58" fill="#fcd34d" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="24" font-weight="900">721311</text>
    <text x="110" y="56" fill="#fde68a" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="12">ANZSCO</text>
    <path d="M 14 72 L 178 72" stroke="rgba(255, 255, 255, 0.1)" stroke-width="1" />
    <text x="14" y="92" fill="#cbd5e1" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="10">Skill Level 4 · 最长 3 年居留</text>
    <text x="14" y="105" fill="#34d399" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="9">英语雅思 4.0 · 雇主须达市场公允薪</text>
  </g>

  <g transform="translate(32, 266)">
    <rect x="0" y="0" width="576" height="52" rx="8" fill="rgba(255, 255, 255, 0.04)" stroke="rgba(255, 255, 255, 0.1)" />
    <path d="M 20 26 L 24 30 L 32 20" fill="none" stroke="#10b981" stroke-width="2" />
    <text x="42" y="24" fill="#f1f5f9" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="11" font-weight="700">技术移民与绿名单直通：薪资达 $35.00/h 享受快速通道</text>
    <text x="42" y="40" fill="#94a3b8" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="10">普通 AEWV 门槛不受中位数强行绑定，但雇主担保须证明达到当地市场公允薪资 (Market Rate)</text>
  </g>

  <g transform="translate(545, 345)">
    <circle cx="0" cy="0" r="34" fill="none" stroke="rgba(16, 185, 129, 0.45)" stroke-width="1.5" stroke-dasharray="3 2" />
    <circle cx="0" cy="0" r="30" fill="none" stroke="rgba(16, 185, 129, 0.8)" stroke-width="1" />
    <text x="0" y="-12" text-anchor="middle" fill="#34d399" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="7" font-weight="800" letter-spacing="1">STATUTE VERIFIED</text>
    <text x="0" y="3" text-anchor="middle" fill="#f8fafc" font-family="ui-monospace, monospace" font-size="9" font-weight="800">2026</text>
    <text x="0" y="16" text-anchor="middle" fill="#34d399" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="6.5" font-weight="700">IMMIGRATION NZ</text>
  </g>

  <text x="32" y="358" fill="#64748b" font-family="ui-monospace, monospace" font-size="10">追踪源: employment.govt.nz &amp; immigration.govt.nz · 哨兵已验证 · 严格拒斥已废止时薪</text>
</svg>